<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宏國地政 | 易丞地政 - 旗艦戰略系統 v10.0</title>
    <style>
        :root { --primary: #2c3e50; --accent: #c0392b; --land: #d35400; --house: #27ae60; --info: #2980b9; --bg: #f8f9fa; }
        
        body { 
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif; 
            background-color: var(--bg); color: #333; margin: 0; padding: 15px; 
            -webkit-print-color-adjust: exact; 
            user-select: none; -webkit-user-select: none;
            overflow-x: hidden; /* 防止手機左右滑動 */
        }
        
        img, div, span { -webkit-user-drag: none; }
        
        .watermark { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; display: flex; justify-content: center; align-items: center; opacity: 0.08; overflow: hidden; }
        .watermark-text { font-size: 8vw; /* 改用視窗比例字體，手機才不會太小 */ font-weight: bold; color: #000; transform: rotate(-30deg); text-align: center; line-height: 1.5; }

        .container { max-width: 1000px; margin: 0 auto; background: rgba(255,255,255,0.98); padding: 25px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative; z-index: 1; }
        
        .brand-header { text-align: center; border-bottom: 3px solid var(--primary); padding-bottom: 15px; margin-bottom: 20px; }
        .brand-header h1 { margin: 0; font-size: 2em; color: var(--primary); letter-spacing: 2px; }
        .brand-header .sub-title { color: var(--accent); font-weight: bold; margin-top: 5px; letter-spacing: 3px; font-size: 1em; }

        /* 設定區塊響應式 */
        .config-zone { background: #e9ecef; padding: 15px; border-radius: 8px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 30px; border: 1px solid #ced4da; }
        .config-item h3 { margin-top: 0; color: var(--primary); font-size: 1.1em; border-bottom: 2px solid #adb5bd; padding-bottom: 5px; }
        
        .radio-group label, .checkbox-group label { display: block; margin: 8px 0; cursor: pointer; font-size: 1.05em; padding: 2px 0; }
        /* 增加點擊區域，方便手機點選 */
        input[type="radio"], input[type="checkbox"] { transform: scale(1.2); margin-right: 8px; }

        .btn-group { grid-column: 1 / -1; display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .action-btn { flex: 1; padding: 15px; border: none; border-radius: 5px; font-size: 1.1em; cursor: pointer; font-weight: bold; transition: 0.3s; color: white; min-width: 200px; }
        .btn-generate { background: var(--primary); }
        .btn-generate:hover { background: #34495e; }
        .btn-print { background: var(--accent); }

        /* 路徑圖 */
        .roadmap { display: none; margin-top: 10px; position: relative; padding-left: 5px; }
        .roadmap::before { content: ''; position: absolute; left: 23px; top: 10px; bottom: 20px; width: 3px; background: #bdc3c7; }
        
        .station { position: relative; margin-bottom: 20px; page-break-inside: avoid; }
        .station-dot { position: absolute; left: 15px; top: 18px; width: 14px; height: 14px; border-radius: 50%; background: white; border: 3px solid var(--primary); z-index: 2; }
        .station.critical .station-dot { border-color: var(--accent); background: var(--accent); }
        
        .station-card { margin-left: 40px; background: white; border: 1px solid #dee2e6; border-radius: 6px; padding: 15px; position: relative; }
        .station-card::before { content: ''; position: absolute; left: -10px; top: 24px; width: 10px; height: 2px; background: var(--primary); }
        .station.critical .station-card { border-color: #fab1a0; background: #fff5f5; border-left: 4px solid var(--accent); }

        .station-title { font-size: 1.15em; font-weight: bold; color: var(--primary); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #ddd; padding-bottom: 5px; margin-bottom: 8px; flex-wrap: wrap; }
        
        .task-item { margin: 8px 0; display: flex; align-items: flex-start; line-height: 1.5; justify-content: space-between; font-size: 1em; cursor: pointer; padding: 2px 0; }
        
        /* 加大 Checkbox 方便手指點擊 */
        .task-checkbox { margin-top: 3px; margin-right: 10px; min-width: 20px; height: 20px; border: 2px solid #bdc3c7; border-radius: 4px; display: flex; align-items: center; justify-content: center; background: white; transition: 0.2s; }
        
        .task-item.checked .task-checkbox { background: var(--house); border-color: var(--house); }
        .task-item.checked .task-checkbox::after { content: '✔'; color: white; font-size: 14px; }
        .task-item.checked { color: #888; text-decoration: none; }
        
        .info-btn { background: var(--info); color: white; border: none; border-radius: 15px; padding: 4px 10px; font-size: 0.85em; cursor: pointer; margin-left: auto; opacity: 0.9; display: inline-flex; align-items: center; white-space: nowrap; margin-top: 2px; }

        .calc-box { background: #e3f2fd; border: 1px solid #90caf9; padding: 10px; border-radius: 6px; margin-top: 8px; font-size: 1em; width: 100%; box-sizing: border-box; }
        .calc-row { display: flex; gap: 8px; margin-bottom: 5px; align-items: center; flex-wrap: wrap; }
        .calc-input { padding: 8px; border: 1px solid #ccc; border-radius: 3px; width: 80px; font-size: 1em; } /* 手機輸入框加大 */

        /* 結案資料區塊 - 改用 Grid 更好控制 RWD */
        .closing-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
        .closing-box { border: 1px solid #aaa; padding: 10px; border-radius: 5px; background: #fff; }
        .closing-title { font-weight: bold; color: var(--primary); font-size: 1em; border-bottom: 2px solid #ddd; margin-bottom: 8px; padding-bottom: 5px; text-align: center; background: #eee; }
        .closing-list { font-size: 0.9em; padding-left: 20px; }
        
        /* 📱 手機版專用 CSS (Max-width 768px) */
        @media screen and (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .brand-header h1 { font-size: 1.6em; }
            .brand-header .sub-title { font-size: 0.9em; letter-spacing: 2px; }
            
            /* 按鈕變垂直排列 */
            .btn-group { flex-direction: column; }
            .action-btn { width: 100%; }
            
            /* 路徑圖調整 */
            .station-card { margin-left: 30px; padding: 10px; }
            .station-title { font-size: 1.1em; }
            .info-btn { font-size: 0.8em; padding: 5px 12px; }
            
            /* 結案區塊手機版強制單欄 */
            .closing-section { grid-template-columns: 1fr; }
        }

        /* 彈窗 */
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.6); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);}
        .modal-content { background-color: #fefefe; margin: 15% auto; padding: 20px; border: 1px solid #888; width: 90%; max-width: 500px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .close { color: #aaa; float: right; font-size: 30px; font-weight: bold; cursor: pointer; padding: 0 10px; }
        
        /* 列印專用 - 保持原有的大字體設計 */
        @media print {
            @page { margin: 5mm; size: A4; }
            body { background: white; padding: 0; font-size: 12pt; -webkit-print-color-adjust: exact; }
            .config-zone, .info-btn, .modal, .btn-group, .watermark { display: none !important; } 
            .container { box-shadow: none; border: none; padding: 0; width: 100%; max-width: 100%; }
            .brand-header h1 { font-size: 22pt; color: #000; }
            .roadmap { display: block !important; }
            .station-card { border: 2px solid #000; box-shadow: none; margin-left: 35px; }
            .station-dot { border-color: #000; }
            .station.critical .station-card { border-color: #000; background: #eee !important; }
            .closing-section { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 5px; }
            .closing-box { border: 1px solid #000; font-size: 9pt; }
            .legal-footer { display: block; text-align: center; font-size: 9pt; margin-top: 20px; border-top: 1px solid #000; padding-top: 5px; }
        }
        .legal-footer { display: none; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="watermark"><div class="watermark-text" id="wmText"></div></div>

<div id="myModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div class="modal-header">
        <span id="modalTitle" style="font-size:1.2em; font-weight:bold; color:#2c3e50;"></span>
        <span id="modalTime" style="background:#27ae60; color:white; padding:2px 6px; border-radius:4px; font-size:0.8em; margin-left:10px;"></span>
    </div>
    <div style="border-bottom:2px solid #2980b9; margin:10px 0;"></div>
    <div class="modal-body">
        <ul class="modal-list" id="modalList" style="padding-left:20px; line-height:1.6;"></ul>
        <div id="modalDesc" style="margin-top:15px; color:#444; font-size:0.95em; background:#f1f1f1; padding:10px; border-radius:5px; border-left:4px solid #2980b9;"></div>
    </div>
  </div>
</div>

<div class="container">
    <div class="brand-header">
        <h1>宏國地政 | 易丞地政</h1>
        <div class="sub-title">案件標準作業戰略地圖 v10.1</div>
    </div>

    <div class="config-zone">
        <div class="config-item">
            <h3>🏠 標的種類</h3>
            <div class="radio-group">
                <label><input type="radio" name="propType" value="house" checked> 房地案件 (透天/大樓)</label>
                <label><input type="radio" name="propType" value="land"> 純土地案件 (農地/建地)</label>
            </div>
        </div>
        <div class="config-item">
            <h3>💰 買方付款</h3>
            <div class="radio-group">
                <label><input type="radio" name="buyerLoan" value="yes" checked> 有貸款 (連件/設定)</label>
                <label><input type="radio" name="buyerLoan" value="no"> 無貸款 (現金)</label>
            </div>
        </div>
        <div class="config-item">
            <h3>🏦 賣方狀況</h3>
            <div class="radio-group">
                <label><input type="radio" name="sellerLoan" value="normal" checked> 一般銀行貸款</label>
                <label><input type="radio" name="sellerLoan" value="none"> 無貸款</label>
            </div>
            <div class="checkbox-group">
                <label><input type="checkbox" id="privateSetting"> ⚠️ 賣方有「私人設定」</label>
            </div>
        </div>
        <div class="btn-group">
            <button class="action-btn btn-generate" onclick="generateMap()">📍 生成戰略路徑</button>
            <button class="action-btn btn-print" onclick="printToPdf()">🖨️ 列印 / 另存 PDF</button>
        </div>
    </div>

    <div id="roadmap" class="roadmap"></div>
    <div class="legal-footer">本文件含商業機密，屬 宏國地政 | 易丞地政 所有。嚴禁未經授權之影印、翻拍、外流。</div>
</div>

<script>
    // --- 系統核心邏輯 ---
    
    // 禁止常見的開發者行為
    document.addEventListener('keydown', function(e) {
        // F12, Ctrl+U, Ctrl+S, Ctrl+Shift+I
        if (e.key === 'F12' || 
           (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) ||
           (e.ctrlKey && e.shiftKey && e.key === 'I')) {
            e.preventDefault();
            alert('⚠️ 系統警告：此操作已被鎖定。');
        }
    });

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('wmText').innerHTML = `宏國地政 | 易丞地政<br>CONFIDENTIAL<br>${today}`;

    function printToPdf() {
        alert("💡 提示：手機端請使用瀏覽器的「分享 -> 列印」功能，\n電腦端請選擇「另存為 PDF」。");
        window.print();
    }

    // 資料庫 (保持不變，為節省篇幅省略部分重複內容，邏輯與原檔相同)
    const taskDB = {
        tax_registry: { title: "申請稅籍與財所清", time: "2 分鐘", docs: ["1. 房屋稅籍證明申請書", "2. 財產所得清單 (買方貸款用)", "3. 賣方身分證影本+印章", "4. 代理人身分證正本+印章"], desc: "請參考【確認表單~1.pdf】與【開戶SOP.docx】" },
        tax_bill: { title: "申請補發稅單", time: "2 分鐘", docs: ["1. 申請項目勾選: 補發稅單 (當年度/欠繳)", "2. 用途: 分算稅金用 (非常重要!)", "3. 身分證影本"] },
        utilities: { title: "水電/瓦斯過戶 SOP", time: "依案件", docs: ["1. 詢問水電公司定抄時間 + 水電錶號", "2. 借鑰匙：拍水電錶 + 天然氣錶照片", "3. 買賣雙方身分證影本 + 印章"], desc: "若是土地案件需申請【臨時用水】，請備妥：原/新用戶身分證+便章、保證人(台南水戶)身分證+便章、保證金約17730元。" },
        online_tax: { title: "線上查欠 (網實) 操作流程", time: "依影片", docs: ["步驟1: 插入自然人憑證", "步驟2: 登入地方稅網路申報系統", "步驟3: 選擇【不動產移轉申報】", "步驟4: 輸入收件字號 -> 查詢，並用印申請書、公契", "步驟5: 上傳用印文件"], desc: "重點：必須將用印後的文件掃描上傳，才能完成查欠。" },
        private_clear: { title: "私設：代墊或動撥文件", time: "高風險", docs: ["【代墊方案】需備文件：1. 本票 & 借據, 2. 委任書, 3. 買賣雙方動撥同意書", "【動撥方案】需備文件：1. 買賣雙方動撥同意書, 2. 賣方擔保本票"], desc: "務必確認金主是否配合塗銷，資金流向需透明。" }
    };

    function showDocs(key) {
        const modal = document.getElementById("myModal");
        if(taskDB[key]) {
            document.getElementById("modalTitle").innerText = taskDB[key].title;
            document.getElementById("modalTime").innerText = "⏱️ " + taskDB[key].time;
            document.getElementById("modalList").innerHTML = taskDB[key].docs.map(item => `<li>${item}</li>`).join('');
            document.getElementById("modalDesc").innerText = taskDB[key].desc || "";
            modal.style.display = "block";
        }
    }
    function closeModal() { document.getElementById("myModal").style.display = "none"; }
    window.onclick = function(e) { if (e.target == document.getElementById("myModal")) closeModal(); }

    function toggleCheck(element) { element.classList.toggle('checked'); }

    function calculatePrePay() {
        let deedTax = parseFloat(document.getElementById('inputDeed').value) || 0;
        let loanAmount = parseFloat(document.getElementById('inputLoan').value) || 0; 
        let total = deedTax + (loanAmount * 10000 * 1.2 * 0.001) + 25000;
        document.getElementById('calcResult').innerHTML = `預估收款：<span style="color:#c0392b;">$${Math.round(total).toLocaleString()}</span>`;
    }

    function generateMap() {
        const propType = document.querySelector('input[name="propType"]:checked').value;
        const buyerLoan = document.querySelector('input[name="buyerLoan"]:checked').value;
        const isPrivate = document.getElementById("privateSetting").checked;
        
        const roadmapDiv = document.getElementById('roadmap');
        roadmapDiv.style.display = 'block';
        
        // 為了讓手機畫面滑動順暢，生成後自動滾動到路徑圖
        setTimeout(() => { roadmapDiv.scrollIntoView({ behavior: 'smooth' }); }, 100);

        let steps = [];
        steps.push({
            title: "Phase 1: 簽約與前置檢核",
            content: `<div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>簽約身分驗證與授權書確認</div></div>
                      <div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>確認買賣雙方身分證、印章、權狀正本</div></div>`
        });

        let phase2Content = `<div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>申請<strong>財產清單</strong> & 稅籍 <button class="info-btn" onclick="event.stopPropagation();showDocs('tax_registry')">ℹ️ SOP</button></div></div>`;
        if (propType === 'house') {
            phase2Content += `<div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>申請稅單 (<strong>分算稅金用</strong>) <button class="info-btn" onclick="event.stopPropagation();showDocs('tax_bill')">ℹ️ SOP</button></div></div>`;
        } else {
            phase2Content += `<div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>申請使用分區 & 無套繪 & 鑑界</div></div>
                              <div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>申請地價稅單 (分算用)</div></div>`;
        }
        steps.push({ title: "Phase 2: 現況與稅務", content: phase2Content });

        if (isPrivate) {
            steps.push({
                title: "⚠️ Phase 2.5: 私人設定拆彈", critical: true,
                content: `<div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>Step 1: 擋拍檢查 (法拍?)</div></div>
                          <div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>Step 2: 資金分流 (代墊/動撥) <button class="info-btn" onclick="event.stopPropagation();showDocs('private_clear')">ℹ️ 應備</button></div></div>`
            });
        }

        steps.push({
            title: "Phase 3: 報稅與完稅",
            content: `<div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>申報增值稅 / 契稅</div></div>
                      <div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span><strong>線上查欠 (網實)</strong> (依影片) <button class="info-btn" onclick="event.stopPropagation();showDocs('online_tax')">ℹ️ 流程</button></div></div>
                      <div class="calc-box">
                         <div style="font-weight:bold; color:var(--info); margin-bottom:5px;">💰 預收款計算機</div>
                         <div class="calc-row">契稅：<input type="number" id="inputDeed" class="calc-input"> 貸(萬)：<input type="number" id="inputLoan" class="calc-input"> <button class="info-btn" onclick="calculatePrePay()">計算</button></div>
                         <div id="calcResult" class="calc-result" style="color:#c0392b; font-weight:bold; margin-top:5px;"></div>
                      </div>
                      <div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>確認完稅款入帳</div></div>`
        });

        let phase4Content = "";
        phase4Content += `<div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>送件：所有權移轉 ${buyerLoan==='yes'?'(+設定 連件)':''}</div></div>`;
        phase4Content += `<div class="task-item" style="border:1px solid red; padding:5px; background:#fff5f5;" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span><strong style="color:#c0392b;">實價登錄申報 (Price Decl.)</strong><div style="font-size:0.9em; color:red; margin-left:24px;">⚠️ 核對價格！含車位價格不可錯 Key！</div></div></div>`;
        phase4Content += `<div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span><strong>${propType==='house'?'過水電/瓦斯':'臨時用水過戶'}</strong> <button class="info-btn" onclick="event.stopPropagation();showDocs('utilities')">ℹ️ SOP</button></div></div>`;
        
        // 結案資料 (使用更乾淨的 HTML 結構)
        phase4Content += `
            <div style="margin-top:10px; border-top:1px dashed #ccc; padding-top:5px; font-weight:bold; color:var(--primary);">📂 結案歸檔分流</div>
            <div class="closing-section">
                <div class="closing-box"><div class="closing-title">賣方袋 (Seller)</div><ul class="closing-list"><li>資料領回表</li><li>公契/私契/稅單(正)</li><li>抵押權塗銷同意書</li><li>代書費發票/明細</li></ul></div>
                <div class="closing-box"><div class="closing-title">買方袋 (Buyer)</div><ul class="closing-list"><li>權狀(正)</li><li>公契/私契/稅單(影)</li><li>謄本/規費收據</li><li>實價登錄(影)</li></ul></div>
                <div class="closing-box"><div class="closing-title">事務所 (Office)</div><ul class="closing-list"><li>案件明細表</li><li>私契(正)</li><li>履保文件/個資</li><li>雙方身分證影本</li></ul></div>
                <div class="closing-box"><div class="closing-title">實價登錄 (Price)</div><ul class="closing-list"><li>申報書</li><li>公契/私契影本</li></ul></div>
            </div>`;

        steps.push({ title: "Phase 4: 過戶與結案", content: phase4Content });

        roadmapDiv.innerHTML = steps.map(s => `
            <div class="station ${s.critical?'critical':''}">
                <div class="station-dot"></div>
                <div class="station-card">
                    <div class="station-title">${s.title}</div>
                    ${s.content}
                </div>
            </div>`).join('');
    }
</script>
