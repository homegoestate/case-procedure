<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宏國地政 | 易丞地政 - 旗艦戰略系統 v10.0</title>
    <style>
        :root { --primary: #2c3e50; --accent: #c0392b; --land: #d35400; --house: #27ae60; --info: #2980b9; --bg: #f8f9fa; }
        
        /* 🚫 IP保護：禁止選取文字 */
        body { 
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif; 
            background-color: var(--bg); color: #333; margin: 0; padding: 20px; 
            -webkit-print-color-adjust: exact; 
            user-select: none; /* 禁止反白 */
            -webkit-user-select: none;
            -moz-user-select: none;
        }
        
        /* 浮水印 */
        .watermark { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; display: flex; justify-content: center; align-items: center; opacity: 0.08; overflow: hidden; }
        .watermark-text { font-size: 60px; font-weight: bold; color: #000; transform: rotate(-30deg); text-align: center; line-height: 1.5; }

        .container { max-width: 1000px; margin: 0 auto; background: rgba(255,255,255,0.98); padding: 30px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative; z-index: 1; }
        
        /* 品牌 */
        .brand-header { text-align: center; border-bottom: 3px solid var(--primary); padding-bottom: 15px; margin-bottom: 20px; }
        .brand-header h1 { margin: 0; font-size: 2.2em; color: var(--primary); letter-spacing: 2px; }
        .brand-header .sub-title { color: var(--accent); font-weight: bold; margin-top: 5px; letter-spacing: 5px; font-size: 1em; }

        /* 設定區 (列印隱藏) */
        .config-zone { background: #e9ecef; padding: 20px; border-radius: 8px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 30px; border: 1px solid #ced4da; }
        .config-item h3 { margin-top: 0; color: var(--primary); font-size: 1em; border-bottom: 2px solid #adb5bd; padding-bottom: 5px; }
        .radio-group label { display: block; margin: 5px 0; cursor: pointer; font-size: 1em; }
        .checkbox-group label { display: block; margin: 5px 0; cursor: pointer; font-size: 1em; color: var(--accent); font-weight: bold; }
        
        .btn-group { grid-column: 1 / -1; display: flex; gap: 10px; margin-top: 5px; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 5px; font-size: 1.2em; cursor: pointer; font-weight: bold; transition: 0.3s; color: white; }
        .btn-generate { background: var(--primary); }
        .btn-generate:hover { background: #34495e; }
        .btn-print { background: var(--accent); }

        /* 地圖區 */
        .roadmap { display: none; margin-top: 10px; position: relative; padding-left: 10px; }
        .roadmap::before { content: ''; position: absolute; left: 28px; top: 10px; bottom: 20px; width: 3px; background: #bdc3c7; }
        
        .station { position: relative; margin-bottom: 20px; page-break-inside: avoid; }
        .station-dot { position: absolute; left: 20px; top: 18px; width: 14px; height: 14px; border-radius: 50%; background: white; border: 3px solid var(--primary); z-index: 2; }
        .station.critical .station-dot { border-color: var(--accent); background: var(--accent); }
        
        .station-card { margin-left: 45px; background: white; border: 1px solid #dee2e6; border-radius: 6px; padding: 15px; position: relative; }
        .station-card::before { content: ''; position: absolute; left: -10px; top: 24px; width: 10px; height: 2px; background: var(--primary); }
        .station.critical .station-card { border-color: #fab1a0; background: #fff5f5; border-left: 4px solid var(--accent); }

        .station-title { font-size: 1.2em; font-weight: bold; color: var(--primary); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #ddd; padding-bottom: 5px; margin-bottom: 8px; }
        .station-tag { font-size: 0.6em; padding: 2px 8px; border-radius: 10px; color: white; vertical-align: middle; margin-left: 5px; font-weight: normal; }
        .tag-land { background: var(--land); }
        .tag-house { background: var(--house); }
        .tag-money { background: #f39c12; }
        .tag-alert { background: var(--accent); }

        .task-item { margin: 4px 0; display: flex; align-items: flex-start; line-height: 1.4; justify-content: space-between; font-size: 0.95em; cursor: pointer; }
        .task-content { display: flex; align-items: center; width: 100%; }
        
        .task-checkbox { margin-top: 2px; margin-right: 8px; min-width: 16px; height: 16px; border: 2px solid #bdc3c7; border-radius: 3px; display: flex; align-items: center; justify-content: center; background: white; transition: 0.2s; }
        .task-item.checked .task-checkbox { background: var(--house); border-color: var(--house); }
        .task-item.checked .task-checkbox::after { content: '✔'; color: white; font-size: 12px; }
        .task-item.checked { color: #555; }
        
        .info-btn { background: var(--info); color: white; border: none; border-radius: 15px; padding: 2px 8px; font-size: 0.75em; cursor: pointer; margin-left: auto; opacity: 0.9; display: flex; align-items: center; gap: 3px; }
        .info-btn:hover { opacity: 1; background: #1f618d; }

        .calc-box { background: #e3f2fd; border: 1px solid #90caf9; padding: 10px; border-radius: 6px; margin-top: 5px; font-size: 0.9em; width: 100%; box-sizing: border-box; }
        .calc-row { display: flex; gap: 5px; margin-bottom: 5px; align-items: center; flex-wrap: wrap; }
        .calc-input { padding: 3px; border: 1px solid #ccc; border-radius: 3px; width: 80px; }
        .calc-result { font-weight: bold; color: var(--accent); font-size: 1em; margin-top: 5px; border-top: 1px solid #ccc; padding-top: 5px; }

        /* 結案資料區塊 */
        .closing-section { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .closing-box { flex: 1; border: 1px solid #aaa; padding: 8px; border-radius: 5px; background: #fff; min-width: 150px; }
        .closing-title { font-weight: bold; color: var(--primary); font-size: 0.9em; border-bottom: 2px solid #ddd; margin-bottom: 5px; padding-bottom: 3px; text-align: center; background: #eee; padding-top:2px;}
        .closing-list { font-size: 0.85em; margin: 0; padding-left: 18px; color: #333; line-height: 1.3; }
        .closing-list li { margin-bottom: 3px; }
        .group-header { font-weight: bold; color: var(--info); margin-top: 5px; font-size: 0.85em; list-style: none; margin-left: -15px; background: #f0f8ff; padding: 2px 5px; border-radius: 3px; }

        /* 彈窗 */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.6); }
        .modal-content { background-color: #fefefe; margin: 5% auto; padding: 20px; border: 1px solid #888; width: 90%; max-width: 600px; border-radius: 8px; }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .modal-header { font-size: 1.2em; font-weight: bold; color: var(--primary); margin-bottom: 10px; border-bottom: 2px solid var(--info); padding-bottom: 5px; display: flex; justify-content: space-between; }
        .time-badge { background: var(--house); color: white; font-size: 0.7em; padding: 2px 6px; border-radius: 4px; vertical-align: middle; }
        .modal-body { max-height: 60vh; overflow-y: auto; font-size: 0.95em; }
        .modal-list { padding-left: 20px; }
        .modal-list li { margin-bottom: 5px; }

        .legal-footer { display: none; }

        /* ⭐ 列印專用 (滿版大字體 + 自動排版) ⭐ */
        @media print {
            @page { margin: 3mm; size: A4; } /* 極限邊界 */
            
            body { 
                background: white; padding: 0; margin: 0; width: 100%; 
                font-size: 12pt; /* 基底字體加大 */
            }
            
            .config-zone, .info-btn, .modal { display: none !important; } 
            
            .container { 
                box-shadow: none; border: none; padding: 0; width: 100%; max-width: 100%; 
            }
            
            .brand-header { padding-bottom: 5px; margin-bottom: 10px; border-bottom: 3px solid #000; }
            .brand-header h1 { font-size: 24pt; color: #000; }
            .brand-header .sub-title { font-size: 10pt; letter-spacing: 5px; color: #000; }
            
            .roadmap { display: block !important; margin-top: 0; padding-left: 0; }
            .roadmap::before { left: 18px; top: 5px; bottom: 5px; width: 4px; background: #000; }

            .station { margin-bottom: 8px; page-break-inside: avoid; }
            .station-dot { left: 10px; top: 10px; width: 14px; height: 14px; border: 3px solid #000; background: #fff; }
            .station-card { margin-left: 35px; padding: 8px; border: 2px solid #000; border-radius: 4px; box-shadow: none; }
            .station-card::before { left: -10px; top: 16px; width: 10px; height: 3px; background: #000; }
            
            .station-title { font-size: 14pt; margin-bottom: 5px; padding-bottom: 3px; color: #000; border-bottom: 1px solid #000; }
            .task-item { font-size: 11pt; margin: 3px 0; line-height: 1.2; font-weight: 500; }
            .task-checkbox { border-color: #000; min-width: 14px; height: 14px; }
            
            .station.critical .station-card { border-color: #000; border-left: 8px solid #000; background: #f0f0f0; }
            
            .calc-box { border: 2px solid #000; background: white; padding: 5px; margin-top: 5px; }
            .calc-row button { display: none; }
            .calc-result { border-top: none; margin-top: 0; padding-top: 0; color: #000; font-size: 12pt; }

            /* 結案資料區塊 - 強制橫向滿版 */
            .closing-section { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 5px; width: 100%; }
            .closing-box { font-size: 9pt; padding: 4px; border: 1px solid #000; min-width: 0; background: none; }
            .closing-title { background: #ddd; color: #000; border-bottom: 1px solid #000; }
            
            .legal-footer { display: block; text-align: center; font-size: 8pt; margin-top: 10px; border-top: 1px solid #000; padding-top: 2px; font-weight: bold; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="watermark"><div class="watermark-text" id="wmText"></div></div>

<div id="myModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div class="modal-header">
        <span id="modalTitle">標題</span>
        <span id="modalTime" class="time-badge"></span>
    </div>
    <div class="modal-body">
        <ul class="modal-list" id="modalList"></ul>
        <div id="modalDesc" style="margin-top:10px; color:#555; font-size:0.9em; background:#f0f0f0; padding:10px; border-radius:5px;"></div>
    </div>
  </div>
</div>

<div class="container">
    <div class="brand-header">
        <h1>宏國地政 | 易丞地政</h1>
        <div class="sub-title">案件標準作業戰略地圖 v10.0</div>
    </div>

    <div class="config-zone">
        <div class="config-item">
            <h3>🏠 標的種類</h3>
            <div class="radio-group">
                <label><input type="radio" name="propType" value="house" checked> 房地案件 (透天/大樓)</label>
                <label><input type="radio" name="propType" value="land"> 純土地案件 (農地/建地)</label>
            </div>
        </div>
        <div class="config-item">
            <h3>💰 買方付款</h3>
            <div class="radio-group">
                <label><input type="radio" name="buyerLoan" value="yes" checked> 有貸款 (連件/設定)</label>
                <label><input type="radio" name="buyerLoan" value="no"> 無貸款 (現金)</label>
            </div>
        </div>
        <div class="config-item">
            <h3>🏦 賣方狀況</h3>
            <div class="radio-group">
                <label><input type="radio" name="sellerLoan" value="normal" checked> 一般銀行貸款</label>
                <label><input type="radio" name="sellerLoan" value="none"> 無貸款</label>
            </div>
            <div class="checkbox-group">
                <label><input type="checkbox" id="privateSetting"> ⚠️ 賣方有「私人設定」</label>
            </div>
        </div>
        <div class="btn-group">
            <button class="action-btn btn-generate" onclick="generateMap()">📍 生成戰略路徑</button>
            <button class="action-btn btn-print" onclick="printToPdf()">🖨️ 列印 / 另存 PDF</button>
        </div>
    </div>

    <div id="roadmap" class="roadmap"></div>
    <div class="legal-footer">本文件含商業機密，屬 宏國地政 | 易丞地政 所有。嚴禁未經授權之影印、翻拍、外流。法律顧問：PCSA 團隊</div>
</div>

<script>
    // IP 保護
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || (e.ctrlKey && e.key === 'u') || (e.ctrlKey && e.key === 's')) {
            e.preventDefault();
            alert('⚠️ 系統警告：此為公司內部機密系統，禁止檢視源碼或另存。');
        }
    });

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('wmText').innerHTML = `宏國地政 | 易丞地政<br>CONFIDENTIAL<br>${today}`;

    // PDF 引導
    function printToPdf() {
        alert("💡 系統提示：\n\n若要存檔為 PDF，請在跳出的列印視窗中，\n將【目的地】選擇為【另存為 PDF】即可。");
        window.print();
    }

    // 資料庫
    const taskDB = {
        tax_registry: {
            title: "申請稅籍與財所清",
            time: "2 分鐘",
            docs: ["1. 房屋稅籍證明申請書", "2. 財產所得清單 (買方貸款用)", "3. 賣方身分證影本+印章", "4. 代理人身分證正本+印章"],
            desc: "請參考【確認表單~1.pdf】與【開戶SOP.docx】"
        },
        tax_bill: {
            title: "申請補發稅單",
            time: "2 分鐘",
            docs: ["1. 申請項目勾選: 補發稅單 (當年度/欠繳)", "2. 用途: 分算稅金用 (非常重要!)", "3. 身分證影本"]
        },
        utilities: {
            title: "水電/瓦斯過戶 SOP",
            time: "依案件",
            docs: ["1. 詢問水電公司定抄時間 + 水電錶號", "2. 借鑰匙：拍水電錶 + 天然氣錶照片", "3. 買賣雙方身分證影本 + 印章"],
            desc: "若是土地案件需申請【臨時用水】，請備妥：原/新用戶身分證+便章、保證人(台南水戶)身分證+便章、保證金約17730元。"
        },
        online_tax: {
            title: "線上查欠 (網實) 操作流程",
            time: "依影片",
            docs: [
                "步驟1: 插入自然人憑證 (或工商憑證)",
                "步驟2: 登入地方稅網路申報系統",
                "步驟3: 選擇【不動產移轉申報】",
                "步驟4: 輸入收件字號 -> 查詢，並用印申請書、公契、身分證影本、印花稅繳納證明",
                "步驟5: 上傳用印文件，並通知稅務局承辦。"
            ],
            desc: "重點：必須將用印後的文件掃描上傳，才能完成查欠。"
        },
        private_clear: {
            title: "私設：代墊或動撥文件",
            time: "高風險",
            docs: [
                "【代墊方案】需備文件：",
                "1. 本票 & 借據",
                "2. 委任書",
                "3. 買賣雙方動撥同意書",
                "4. 金主清償文件 (借據、本票)",
                "",
                "【動撥方案】需備文件：",
                "1. 買賣雙方動撥同意書",
                "2. 賣方擔保本票",
                "3. 金主清償文件 (借據、本票)"
            ],
            desc: "務必確認金主是否配合塗銷，資金流向需透明。"
        }
    };

    function showDocs(key) {
        const modal = document.getElementById("myModal");
        if(taskDB[key]) {
            document.getElementById("modalTitle").innerText = taskDB[key].title;
            document.getElementById("modalTime").innerText = "⏱️ " + taskDB[key].time;
            document.getElementById("modalList").innerHTML = taskDB[key].docs.map(item => `<li>${item}</li>`).join('');
            document.getElementById("modalDesc").innerText = taskDB[key].desc || "";
            modal.style.display = "block";
        }
    }
    function closeModal() { document.getElementById("myModal").style.display = "none"; }
    window.onclick = function(e) { if (e.target == document.getElementById("myModal")) closeModal(); }

    function toggleCheck(element) {
        element.classList.toggle('checked');
    }

    function calculatePrePay() {
        let deedTax = parseFloat(document.getElementById('inputDeed').value) || 0;
        let loanAmount = parseFloat(document.getElementById('inputLoan').value) || 0; 
        let total = deedTax + (loanAmount * 10000 * 1.2 * 0.001) + 25000;
        document.getElementById('calcResult').innerHTML = `預估收款：<span style="color:#c0392b;">$${Math.round(total).toLocaleString()}</span> (含稅費/規費/代書費，多退少補)`;
    }

    function generateMap() {
        const propType = document.querySelector('input[name="propType"]:checked').value;
        const buyerLoan = document.querySelector('input[name="buyerLoan"]:checked').value;
        const isPrivate = document.getElementById("privateSetting").checked;
        
        const roadmapDiv = document.getElementById('roadmap');
        roadmapDiv.style.display = 'block';
        roadmapDiv.innerHTML = '';

        let steps = [];

        // Phase 1
        steps.push({
            title: "Phase 1: 簽約與前置檢核",
            content: `
                <div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>簽約身分驗證與授權書確認</div></div>
                <div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>確認買賣雙方身分證、印章、權狀正本</div></div>`
        });

        // Phase 2
        let phase2Content = `<div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>申請<strong>財產清單</strong> & 稅籍 <button class="info-btn" onclick="event.stopPropagation();showDocs('tax_registry')">ℹ️ SOP</button></div></div>`;
        if (propType === 'house') {
            phase2Content += `<div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>申請稅單 (<strong>分算稅金用</strong>) <button class="info-btn" onclick="event.stopPropagation();showDocs('tax_bill')">ℹ️ SOP</button></div></div>`;
        } else {
            phase2Content += `<div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>申請使用分區 & 無套繪 & 鑑界</div></div>
                              <div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>申請地價稅單 (分算用)</div></div>`;
        }
        steps.push({ title: "Phase 2: 現況與稅務", content: phase2Content });

        // Phase 2.5
        if (isPrivate) {
            steps.push({
                title: "⚠️ Phase 2.5: 私人設定拆彈",
                critical: true,
                content: `<div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>Step 1: 擋拍檢查 (法拍?)</div></div>
                          <div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>Step 2: 資金分流 (代墊/動撥) <button class="info-btn" onclick="event.stopPropagation();showDocs('private_clear')">ℹ️ 應備</button></div></div>`
            });
        }

        // Phase 3
        steps.push({
            title: "Phase 3: 報稅與完稅",
            content: `<div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>申報增值稅 / 契稅</div></div>
                      <div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span><strong>線上查欠 (網實)</strong> (依影片) <button class="info-btn" onclick="event.stopPropagation();showDocs('online_tax')">ℹ️ 流程</button></div></div>
                      <div class="calc-box">
                         <div style="font-weight:bold; color:var(--info); margin-bottom:5px;">💰 預收款計算機</div>
                         <div class="calc-row">契稅：<input type="number" id="inputDeed" class="calc-input"> 貸(萬)：<input type="number" id="inputLoan" class="calc-input"> <button class="info-btn" onclick="calculatePrePay()">計算</button></div>
                         <div id="calcResult" class="calc-result"></div>
                      </div>
                      <div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>確認完稅款入帳</div></div>`
        });

        // Phase 4
        let phase4Content = "";
        phase4Content += `<div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span>送件：所有權移轉 ${buyerLoan==='yes'?'(+設定 連件)':''}</div></div>`;
        
        phase4Content += `
            <div class="task-item" style="border:1px solid red; padding:5px; background:#fff5f5;" onclick="toggleCheck(this)">
                <div class="task-content" style="display:block;">
                    <div style="display:flex; align-items:center;">
                        <span class="task-checkbox"></span>
                        <strong style="color:#c0392b;">實價登錄申報 (Price Decl.)</strong>
                    </div>
                    <div style="font-size:0.9em; color:red; margin-left:24px;">
                        ⚠️ 優先核對契約價格！含車位價格不可錯 Key！<br>
                        (涉及價格不實罰 3~15 萬元/件！！！)
                    </div>
                </div>
            </div>`;

        phase4Content += `<div class="task-item" onclick="toggleCheck(this)"><div class="task-content"><span class="task-checkbox"></span><strong>${propType==='house'?'過水電/瓦斯':'臨時用水過戶'}</strong> <button class="info-btn" onclick="event.stopPropagation();showDocs('utilities')">ℹ️ SOP</button></div></div>`;
        
        // 結案資料
        phase4Content += `
            <div style="margin-top:5px; border-top:1px dashed #ccc; padding-top:5px; font-weight:bold; color:var(--primary);">📂 結案歸檔分流 (請依序排列)</div>
            <div class="closing-section">
                <div class="closing-box">
                    <div class="closing-title">賣方袋 (Seller)</div>
                    <ul class="closing-list">
                        <li class="group-header">封面: 不動產概要說明書</li>
                        <li>1.資料領回表(含印章)</li>
                        <li>2.印章(小夾鏈袋訂於表上)</li>
                        <li class="group-header">封面: 公契、買賣契約書</li>
                        <li>1.土地移轉契約書(含土地印花稅單)+土增稅單(正)</li>
                        <li>2.地價稅單(正)(若有)</li>
                        <li>3.建物移轉契約書(含建物印花稅單)+契稅單(影)</li>
                        <li>4.房屋稅單(正)(若有)</li>
                        <li class="group-header">封面: 抵押權設定契約書</li>
                        <li>1.抵押權塗銷同意書(影)</li>
                        <li>2.火險單(正)</li>
                        <li>3.水電瓦斯繳費單(正)</li>
                        <li>4.規費收據(影)</li>
                        <li>5.收費明細+代書費收據(正)</li>
                        <li>6.履保明細暨點交證明(影)</li>
                        <li>7.財產交易申報書(正)</li>
                    </ul>
                </div>
                <div class="closing-box">
                    <div class="closing-title">買方袋 (Buyer)</div>
                    <ul class="closing-list">
                        <li class="group-header">封面: 不動產概要說明書</li>
                        <li>1.資料領回表(含印章)</li>
                        <li class="group-header">封面: 公契、買賣契約書</li>
                        <li>1.新權狀(正)(土地+建物)</li>
                        <li>2.建物移轉契約書+契稅單(正)</li>
                        <li>3.房屋稅單(影)</li>
                        <li>4.土地移轉契約書+土增稅單(影)</li>
                        <li>5.地價稅單(影)</li>
                        <li class="group-header">封面: 抵押權設定契約書</li>
                        <li>1.抵押權設定契約書(正)</li>
                        <li>2.他項權利證明書(正)</li>
                        <li>3.火險單+收據(正)</li>
                        <li>4.水電瓦斯繳費單(正)</li>
                        <li>5.規費收據(影)</li>
                        <li>6.收費明細+代書費收據(正)</li>
                        <li>7.履保明細暨點交證明(影)</li>
                        <li>8.實價登錄申報書(影)</li>
                        <li>9.說明書/保固書/遙控器</li>
                    </ul>
                </div>
                <div class="closing-box">
                    <div class="closing-title">事務所留底 (Office)</div>
                    <ul class="closing-list">
                        <li>1.案件明細表(背表)</li>
                        <li>2.履保點交/動撥/領回單</li>
                        <li>3.稅費分算單/收費明細</li>
                        <li>4.規費收據/水電收據</li>
                        <li>5.公契/稅單/權狀/謄本(影)</li>
                        <li>6.私契(正)</li>
                        <li>7.履保申請書/個資/洗錢/總表</li>
                        <li>8.買賣身分證(財所清/稅籍)</li>
                    </ul>
                </div>
                <div class="closing-box">
                    <div class="closing-title">實價登錄 (Price)</div>
                    <ul class="closing-list">
                        <li>1.申報書</li>
                        <li>2.登錄通知單</li>
                        <li>3.公契影本</li>
                        <li>4.權狀/謄本影本</li>
                        <li>5.私契影本</li>
                    </ul>
                </div>
            </div>
        `;

        steps.push({ title: "Phase 4: 過戶與結案", content: phase4Content });

        // Render
        roadmapDiv.innerHTML = steps.map(s => `
            <div class="station ${s.critical?'critical':''}">
                <div class="station-dot"></div>
                <div class="station-card">
                    <div class="station-title">${s.title}</div>
                    ${s.content}
                </div>
            </div>`).join('');
    }
</script>
